spring.application.name=autosave-coach-backend

# ===== Database (Persistent H2) =====
#spring.datasource.url=jdbc:h2:file:./data/autosavecoach
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# ===== Database (Postgres SQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/autosavecoach
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

# ===== JPA =====
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 Console =====
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2

spring.jackson.deserialization.fail-on-unknown-properties=true


# ========== SECURITY ==========
logging.level.org.springframework.security=DEBUG

# ========== WEB / MVC ==========
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# ========== JWT ==========
logging.level.com.autosavecoach.backend.security=DEBUG
logging.level.com.autosavecoach.backend.service.JwtService=DEBUG

# ========== ERRORS ==========
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ========== JPA ==========
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========= Spring Mail ========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true